<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SlushAI 3D Modeller</title>
    <link rel="stylesheet" href="themes.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            max-width: 480px;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 48px;
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            text-align: center;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .subtitle {
            text-align: center;
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-soft);
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-1);
            background: var(--card);
        }

        .form-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .form-button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px var(--accent-soft);
        }

        .form-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            display: block;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
            display: block;
        }

        .password-strength {
            font-size: 12px;
            margin-top: -12px;
            margin-bottom: 12px;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .strength-weak { color: #ef4444; }
        .strength-medium { color: #f59e0b; }
        .strength-strong { color: #22c55e; }

        .requirements {
            background: var(--bg-soft);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .requirements h3 {
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .requirements ul {
            list-style: none;
            padding: 0;
            font-size: 12px;
            color: var(--text-sub);
        }

        .requirements li {
            padding: 4px 0;
        }

        .requirements li::before {
            content: "•";
            margin-right: 8px;
            color: var(--accent-1);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--accent-1);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="app-bg">
    <div class="reset-container">
        <div class="logo">🔒</div>
        <h1>Reset Your Password</h1>
        <p class="subtitle">Enter your new password below</p>

        <div id="message" class="message"></div>

        <form id="reset-form">
            <input type="password" id="new-password" class="form-input" placeholder="New Password (min 8 characters)" required>
            <div id="password-strength" class="password-strength"></div>
            
            <input type="password" id="confirm-password" class="form-input" placeholder="Confirm New Password" required>

            <div class="requirements">
                <h3>Password Requirements:</h3>
                <ul>
                    <li>At least 8 characters long</li>
                    <li>Mix of uppercase and lowercase letters recommended</li>
                    <li>Include numbers and special characters for strength</li>
                </ul>
            </div>

            <button type="submit" class="form-button" id="reset-btn">Reset Password</button>
        </form>

        <div class="back-link">
            <a href="/">← Back to Login</a>
        </div>
    </div>

    <script src="themeSwitcher.js"></script>
    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showMessage('Invalid or missing reset token', true);
            document.getElementById('reset-form').style.display = 'none';
        }

        function showMessage(message, isError = false) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = isError ? 'message error' : 'message success';
        }

        function checkPasswordStrength() {
            const password = document.getElementById('new-password').value;
            const strengthDiv = document.getElementById('password-strength');
            
            if (!password) {
                strengthDiv.innerHTML = '';
                return;
            }
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            if (strength < 3) {
                strengthDiv.innerHTML = '⚠️ Weak password';
                strengthDiv.className = 'password-strength strength-weak';
            } else if (strength < 5) {
                strengthDiv.innerHTML = '✓ Medium password';
                strengthDiv.className = 'password-strength strength-medium';
            } else {
                strengthDiv.innerHTML = '✓✓ Strong password';
                strengthDiv.className = 'password-strength strength-strong';
            }
        }

        document.getElementById('new-password').addEventListener('input', checkPasswordStrength);

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const btn = document.getElementById('reset-btn');
            
            // Check if passwords match
            if (newPassword !== confirmPassword) {
                showMessage('❌ Passwords do not match', true);
                return;
            }
            
            // Check minimum length
            if (newPassword.length < 8) {
                showMessage('❌ Password must be at least 8 characters long', true);
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Resetting Password...';
            
            try {
                const response = await fetch('/auth/password-reset/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: newPassword })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showMessage('✅ Password successfully reset! Redirecting to login...', false);
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    showMessage('❌ ' + (data.error || 'Failed to reset password'), true);
                    btn.disabled = false;
                    btn.textContent = 'Reset Password';
                }
            } catch (error) {
                showMessage('❌ Network error. Please try again.', true);
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
