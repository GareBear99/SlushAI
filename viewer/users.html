<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List - SlushAI 3D Modeller</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f43f5e, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }
        
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        
        .search-box {
            flex: 1;
            max-width: 400px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        
        .search-box input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #f97316;
        }
        
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.5;
        }
        
        .filter-btn {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #f43f5e, #f97316);
            border-color: transparent;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #f97316;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .users-table {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: rgba(255, 255, 255, 0.08);
        }
        
        th {
            padding: 16px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #f97316;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        tbody tr {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }
        
        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        
        td {
            padding: 16px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge-founder { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; }
        .badge-admin { background: linear-gradient(135deg, #f43f5e, #e11d48); }
        .badge-moderator { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .badge-pro { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .badge-standard { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .badge-free { background: rgba(255, 255, 255, 0.2); }
        
        .tier-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        
        .status-dot.offline {
            background: rgba(255, 255, 255, 0.3);
            animation: none;
        }
        
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .username {
            font-weight: 600;
            color: #60a5fa;
        }
        
        .email {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 40px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .back-link:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-4px);
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .error {
            text-align: center;
            padding: 60px 20px;
            color: #f43f5e;
            font-size: 18px;
        }
        
        .no-users {
            text-align: center;
            padding: 60px 20px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .level-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👥 User Directory</h1>
            <div class="subtitle">Browse all registered users and their profiles</div>
        </header>
        
        <div class="stats-row" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="total-users">-</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="active-users">-</div>
                <div class="stat-label">Active Now</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="staff-count">-</div>
                <div class="stat-label">Staff Members</div>
            </div>
        </div>
        
        <div class="controls">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search by username, email, or name...">
                <span class="search-icon">🔍</span>
            </div>
            <button class="filter-btn active" data-tier="all">All Users</button>
            <button class="filter-btn" data-tier="founder">Founder</button>
            <button class="filter-btn" data-tier="admin">Admin</button>
            <button class="filter-btn" data-tier="moderator">Moderator</button>
            <button class="filter-btn" data-tier="pro">Pro</button>
            <button class="filter-btn" data-tier="standard">Standard</button>
            <button class="filter-btn" data-tier="free">Free</button>
        </div>
        
        <div class="users-table">
            <table>
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Username</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Tier</th>
                        <th>Badge</th>
                        <th>Models</th>
                        <th>Joined</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <tr>
                        <td colspan="8" class="loading">Loading users...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div style="display: flex; gap: 12px; justify-content: center; margin-top: 40px;">
            <a href="/" class="back-link" style="margin: 0;">
                <span>←</span>
                <span>Back to Home</span>
            </a>
            <a href="/docs" class="back-link" style="margin: 0;">
                <span>📚</span>
                <span>Documentation</span>
            </a>
        </div>
    </div>
    
    <script>
        let allUsers = [];
        let currentFilter = 'all';
        
        const BADGE_LEVELS = {
            0: { name: 'Newcomer', color: '#9ca3af', icon: '🌱' },
            1: { name: 'Creator', color: '#22c55e', icon: '✨' },
            2: { name: 'Artist', color: '#3b82f6', icon: '🎨' },
            3: { name: 'Expert', color: '#8b5cf6', icon: '🔮' },
            4: { name: 'Master', color: '#f59e0b', icon: '👑' },
            5: { name: 'Legend', color: '#ef4444', icon: '🔥' }
        };
        
        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users/list');
                const data = await response.json();

                if (data.success) {
                    allUsers = data.users;
                    updateStats();
                    displayUsers(allUsers);
                } else if (response.status === 403) {
                    // Stage 3 (#12): this directory is staff-only by design.
                    // Say so plainly instead of showing a bare error row.
                    document.getElementById('users-tbody').innerHTML =
                        '<tr><td colspan="8" style="text-align:center; padding:40px 20px;">'
                        + '<div style="font-size:40px; margin-bottom:12px;">🔒</div>'
                        + '<div style="font-weight:600; margin-bottom:6px;">Staff-only directory</div>'
                        + '<div style="color: var(--text-sub, #888); font-size:13px;">The user directory is only visible to staff accounts (founder, admin, moderator). '
                        + 'Sign in with a staff account to see it.</div></td></tr>';
                } else {
                    document.getElementById('users-tbody').innerHTML =
                        '<tr><td colspan="8" class="error">❌ ' + (data.error || 'Failed to load users') + '</td></tr>';
                }
            } catch (error) {
                document.getElementById('users-tbody').innerHTML =
                    '<tr><td colspan="8" class="error">❌ Error loading users: ' + error.message + '</td></tr>';
            }
        }
        
        function updateStats() {
            const totalUsers = allUsers.length;
            const activeUsers = allUsers.filter(u => u.active).length;
            const staffCount = allUsers.filter(u => ['founder', 'admin', 'moderator'].includes(u.subscription_tier)).length;
            
            document.getElementById('total-users').textContent = totalUsers;
            document.getElementById('active-users').textContent = activeUsers;
            document.getElementById('staff-count').textContent = staffCount;
        }
        
        function displayUsers(users) {
            const tbody = document.getElementById('users-tbody');
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="no-users">No users found</td></tr>';
                return;
            }
            
            tbody.innerHTML = users.map(user => {
                const badge = BADGE_LEVELS[user.badge_level] || BADGE_LEVELS[0];
                const joinDate = new Date(user.created_at).toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric', 
                    year: 'numeric' 
                });
                
                const tierClass = user.subscription_tier.split('_')[0]; // Get base tier (e.g., 'standard' from 'standard_weekly')
                
                return `
                    <tr>
                        <td>
                            <div class="status-indicator">
                                <span class="status-dot ${user.active ? '' : 'offline'}"></span>
                                ${user.active ? 'Online' : 'Offline'}
                            </div>
                        </td>
                        <td class="username">${user.username}</td>
                        <td>${user.name || '-'}</td>
                        <td class="email">${user.email_masked}</td>
                        <td>
                            <span class="badge badge-${tierClass}">${user.subscription_tier}</span>
                        </td>
                        <td>
                            <span class="level-badge" style="color: ${badge.color}; border-color: ${badge.color}">
                                ${badge.icon} ${badge.name}
                            </span>
                        </td>
                        <td>${user.lifetime_completions || 0}</td>
                        <td>${joinDate}</td>
                    </tr>
                `;
            }).join('');
        }
        
        function filterUsers() {
            let filtered = allUsers;
            
            // Apply tier filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(user => {
                    const baseTier = user.subscription_tier.split('_')[0];
                    return baseTier === currentFilter || user.subscription_tier === currentFilter;
                });
            }
            
            // Apply search filter
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(user => 
                    user.username.toLowerCase().includes(searchTerm) ||
                    user.email.toLowerCase().includes(searchTerm) ||
                    (user.name && user.name.toLowerCase().includes(searchTerm))
                );
            }
            
            displayUsers(filtered);
        }
        
        // Event listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.tier;
                filterUsers();
            });
        });
        
        document.getElementById('search-input').addEventListener('input', filterUsers);
        
        // Load users on page load
        loadUsers();
        
        // Refresh every 30 seconds
        setInterval(loadUsers, 30000);
    </script>
</body>
</html>
