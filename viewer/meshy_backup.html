<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI3DModeller - Meshy Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* LEFT SIDEBAR - Generation Controls */
        .sidebar-left {
            width: 300px;
            background: #1a1a1a;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
        }

        .sidebar-header h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .tab {
            padding: 8px 16px;
            background: #2a2a2a;
            border: none;
            border-radius: 6px;
            color: #888;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tab.active {
            background: #4a9eff;
            color: white;
        }

        .controls {
            padding: 20px;
            flex: 1;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
        }

        .upload-area {
            border: 2px dashed #3a3a3a;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #1a1a1a;
        }

        .upload-area:hover {
            border-color: #4a9eff;
            background: #222;
        }

        .upload-area.has-image {
            padding: 0;
            border-style: solid;
        }

        .upload-preview {
            width: 100%;
            border-radius: 6px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 13px;
            resize: vertical;
            min-height: 100px;
        }

        select {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 13px;
        }

        .aspect-ratio-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .aspect-btn {
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #999;
            cursor: pointer;
            font-size: 11px;
            text-align: center;
            transition: all 0.2s;
        }

        .aspect-btn.active {
            background: #4a9eff;
            color: white;
            border-color: #4a9eff;
        }

        .generate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .generate-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(168, 224, 99, 0.3);
        }

        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* CENTER - 3D Viewer */
        .viewer-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f0f0f;
        }

        .viewer-header {
            padding: 15px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .viewer-title {
            font-size: 14px;
            color: #999;
        }

        .view-controls {
            display: flex;
            gap: 10px;
        }

        .view-btn {
            padding: 6px 12px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #999;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .view-btn:hover {
            background: #3a3a3a;
        }

        .canvas-container {
            flex: 1;
            position: relative;
        }

        #canvas {
            width: 100%;
            height: 100%;
        }

        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        /* RIGHT SIDEBAR - Assets Gallery */
        .sidebar-right {
            width: 320px;
            background: #1a1a1a;
            border-left: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .assets-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
        }

        .assets-header input {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 13px;
        }

        .view-mode-btns {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .view-mode-btn {
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            cursor: pointer;
            color: #666;
            transition: all 0.2s;
        }

        .view-mode-btn.active {
            background: #3a3a3a;
            color: #4a9eff;
        }

        .assets-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .collection {
            margin-bottom: 30px;
        }

        .collection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .collection-title {
            font-size: 13px;
            font-weight: 600;
            color: #999;
        }

        .collection-count {
            font-size: 12px;
            color: #666;
        }

        .assets-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .asset-card {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .asset-card:hover {
            transform: translateY(-2px);
            border-color: #4a9eff;
        }

        .asset-card.active {
            border-color: #4a9eff;
        }

        .asset-thumbnail {
            width: 100%;
            aspect-ratio: 1;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .asset-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .asset-info {
            padding: 8px;
        }

        .asset-name {
            font-size: 11px;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .asset-stats {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px;
            border-top: 1px solid #2a2a2a;
        }

        .page-btn {
            padding: 6px 10px;
            background: #2a2a2a;
            border: none;
            border-radius: 4px;
            color: #666;
            cursor: pointer;
            font-size: 12px;
        }

        .page-btn:hover {
            background: #3a3a3a;
        }

        .page-info {
            font-size: 12px;
            color: #666;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-card {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            min-width: 300px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #2a2a2a;
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #2a2a2a;
            border-radius: 2px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: #4a9eff;
            width: 0%;
            transition: width 0.3s;
        }

        input[type="file"] {
            display: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- LEFT SIDEBAR -->
        <div class="sidebar-left">
            <div class="sidebar-header">
                <h2>New Image</h2>
                <div class="tabs">
                    <button class="tab active" data-tab="image">Image</button>
                    <button class="tab" data-tab="prompt">Prompt</button>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label>Upload Reference Image</label>
                    <div class="upload-area" id="uploadArea">
                        <div id="uploadPrompt">
                            <div style="font-size: 32px; margin-bottom: 10px;">📁</div>
                            <div style="font-size: 13px; color: #666;">Click / Drag & Drop / Paste Image</div>
                            <div style="font-size: 11px; color: #555; margin-top: 5px;">Supported: png, jpg, jpeg, webp</div>
                        </div>
                        <img id="uploadPreview" class="upload-preview" style="display: none;">
                    </div>
                    <input type="file" id="fileInput" accept="image/*">
                </div>

                <div class="control-group">
                    <label>AI Model</label>
                    <select id="modelSelect">
                        <option value="triposr" selected>TripoSR (High Quality) - Recommended</option>
                        <option value="native">Native (Fast - 2.5D only)</option>
                        <option value="proc">Procedural (Fallback cube)</option>
                    </select>
                    <div style="font-size: 11px; color: #666; margin-top: 5px;">⚠️ Use TripoSR for full 3D models like Meshy</div>
                </div>

                <div class="control-group">
                    <label>Aspect Ratio</label>
                    <div class="aspect-ratio-grid">
                        <button class="aspect-btn active" data-ratio="1:1">1:1</button>
                        <button class="aspect-btn" data-ratio="16:9">16:9</button>
                        <button class="aspect-btn" data-ratio="9:16">9:16</button>
                        <button class="aspect-btn" data-ratio="4:3">4:3</button>
                        <button class="aspect-btn" data-ratio="3:4">3:4</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Generation Time</label>
                    <select id="timeSelect">
                        <option value="fast">Fast (~1 min)</option>
                        <option value="standard" selected>Standard (~2-3 min)</option>
                        <option value="quality">Quality (~5 min)</option>
                    </select>
                </div>

                <button class="generate-btn" id="generateBtn" disabled>
                    <span>⚡</span>
                    <span>Generate 3D Model</span>
                </button>
            </div>
        </div>

        <!-- CENTER VIEWER -->
        <div class="viewer-area">
            <div class="viewer-header">
                <div class="viewer-title">3D Preview</div>
                <div class="view-controls">
                    <button class="view-btn" onclick="toggleWireframe()">📐 Wireframe</button>
                    <button class="view-btn" onclick="toggleTexture()">🎨 Texture</button>
                    <button class="view-btn" onclick="resetCamera()">🔄 Reset</button>
                    <button class="view-btn" onclick="exportScreenshot()">📸 Screenshot</button>
                </div>
            </div>
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
                <div class="empty-state" id="emptyState">
                    <div class="empty-state-icon">🎨</div>
                    <h3 style="margin-bottom: 10px;">What will you create today?</h3>
                    <p>Generate a new model from image or text, or edit one from your asset library</p>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDEBAR -->
        <div class="sidebar-right">
            <div class="assets-header">
                <input type="text" placeholder="🔍 Search my generation" id="searchInput">
                <div class="view-mode-btns">
                    <button class="view-mode-btn active">📁</button>
                    <button class="view-mode-btn">📋</button>
                    <button class="view-mode-btn">🖼</button>
                </div>
            </div>

            <div class="assets-list" id="assetsList">
                <!-- Collections will be populated here -->
            </div>

            <div class="pagination">
                <button class="page-btn">«</button>
                <button class="page-btn">‹</button>
                <span class="page-info">1/1</span>
                <button class="page-btn">›</button>
                <button class="page-btn">»</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <h3 id="loadingTitle">Generating 3D Model...</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p id="loadingStatus" style="font-size: 13px; color: #666;">Initializing...</p>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        let scene, camera, renderer, controls, currentMesh;
        let uploadedImage = null;

        // Initialize 3D scene
        function initScene() {
            const canvas = document.getElementById('canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f0f0f);
            
            camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 3.5);
            
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            
            controls = new OrbitControls(camera, canvas);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            
            // Meshy-style lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);
            
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
            keyLight.position.set(5, 8, 3);
            keyLight.castShadow = true;
            scene.add(keyLight);
            
            const fillLight = new THREE.DirectionalLight(0xaaccff, 0.5);
            fillLight.position.set(-3, 3, -2);
            scene.add(fillLight);
            
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
            rimLight.position.set(0, 2, -5);
            scene.add(rimLight);
            
            const grid = new THREE.GridHelper(10, 20, 0x333333, 0x1a1a1a);
            grid.position.y = -0.5;
            scene.add(grid);
            
            animate();
            window.addEventListener('resize', onResize);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onResize() {
            const canvas = document.getElementById('canvas');
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        }

        // UI Event Handlers
        document.getElementById('uploadArea').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // Drag and drop
        document.getElementById('uploadArea').addEventListener('dragover', (e) => {
            e.preventDefault();
            e.currentTarget.style.borderColor = '#4a9eff';
        });

        document.getElementById('uploadArea').addEventListener('dragleave', (e) => {
            e.currentTarget.style.borderColor = '#3a3a3a';
        });

        document.getElementById('uploadArea').addEventListener('drop', (e) => {
            e.preventDefault();
            e.currentTarget.style.borderColor = '#3a3a3a';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        function handleFile(file) {
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImage = e.target.result;
                const preview = document.getElementById('uploadPreview');
                const prompt = document.getElementById('uploadPrompt');
                const area = document.getElementById('uploadArea');
                
                preview.src = uploadedImage;
                preview.style.display = 'block';
                prompt.style.display = 'none';
                area.classList.add('has-image');
                
                document.getElementById('generateBtn').disabled = false;
            };
            reader.readAsDataURL(file);
        }

        // Aspect ratio buttons
        document.querySelectorAll('.aspect-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.aspect-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Generate button
        document.getElementById('generateBtn').addEventListener('click', async () => {
            if (!uploadedImage) return;
            
            const overlay = document.getElementById('loadingOverlay');
            const emptyState = document.getElementById('emptyState');
            const progressFill = document.getElementById('progressFill');
            const statusText = document.getElementById('loadingStatus');
            const model = document.getElementById('modelSelect').value;
            
            overlay.classList.add('active');
            emptyState.style.display = 'none';
            
            // Simulate generation progress
            const stages = [
                { progress: 20, text: 'Loading model weights...' },
                { progress: 40, text: 'Preprocessing image...' },
                { progress: 70, text: 'Running 3D reconstruction...' },
                { progress: 90, text: 'Extracting mesh geometry...' },
                { progress: 100, text: 'Finalizing...' }
            ];
            
            for (const stage of stages) {
                await new Promise(resolve => setTimeout(resolve, 1000));
                progressFill.style.width = stage.progress + '%';
                statusText.textContent = stage.text;
            }
            
            // Call backend to actually generate
            try {
                const formData = new FormData();
                const blob = await (await fetch(uploadedImage)).blob();
                formData.append('image', blob, 'upload.jpg');
                formData.append('backend', model);
                
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    await loadModel(data.preview_path);
                    loadAssets(); // Refresh asset list
                }
            } catch (error) {
                console.error('Generation error:', error);
                alert('Generation failed: ' + error.message);
            }
            
            overlay.classList.remove('active');
            progressFill.style.width = '0%';
        });

        // Load and display 3D model
        async function loadModel(path) {
            if (currentMesh) {
                scene.remove(currentMesh);
            }
            
            const loader = new OBJLoader();
            const obj = await loader.loadAsync(path);
            
            obj.traverse((child) => {
                if (child.isMesh) {
                    child.scale.x *= -1; // Fix mirror
                    
                    const clayMaterial = new THREE.MeshStandardMaterial({
                        color: 0xd4a574,
                        metalness: 0.0,
                        roughness: 0.95
                    });
                    
                    child.material = clayMaterial;
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            
            // Center and scale
            const box = new THREE.Box3().setFromObject(obj);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const scale = 2 / Math.max(size.x, size.y, size.z);
            
            obj.position.sub(center.multiplyScalar(scale));
            obj.scale.multiplyScalar(scale);
            
            currentMesh = obj;
            scene.add(obj);
        }

        // Load assets from server
        async function loadAssets() {
            try {
                const response = await fetch('/api/models');
                const models = await response.json();
                
                const assetsList = document.getElementById('assetsList');
                const collections = {};
                
                // Group by collection
                models.forEach(model => {
                    const collection = 'Recent Generations';
                    if (!collections[collection]) {
                        collections[collection] = [];
                    }
                    collections[collection].push(model);
                });
                
                // Render collections
                assetsList.innerHTML = Object.entries(collections).map(([name, assets]) => `
                    <div class="collection">
                        <div class="collection-header">
                            <span class="collection-title">${name}</span>
                            <span class="collection-count">All ${assets.length} assets ›</span>
                        </div>
                        <div class="assets-grid">
                            ${assets.slice(0, 6).map(asset => `
                                <div class="asset-card" onclick="loadModel('${asset.path}')">
                                    <div class="asset-thumbnail">
                                        <img src="/api/thumbnail?path=${encodeURIComponent(asset.path)}" 
                                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%231a1a1a%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22%3E3D%3C/text%3E%3C/svg%3E'">
                                    </div>
                                    <div class="asset-info">
                                        <div class="asset-name">${asset.name}</div>
                                        <div class="asset-stats">${(asset.vertices || 0).toLocaleString()} verts</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading assets:', error);
            }
        }

        // Export functions for buttons
        window.toggleWireframe = function() {
            // Implementation
        };

        window.toggleTexture = function() {
            // Implementation
        };

        window.resetCamera = function() {
            camera.position.set(0, 1.5, 3.5);
            controls.target.set(0, 0, 0);
            controls.update();
        };

        window.exportScreenshot = function() {
            renderer.render(scene, camera);
            const link = document.createElement('a');
            link.download = 'screenshot.png';
            link.href = renderer.domElement.toDataURL();
            link.click();
        };

        window.loadModel = loadModel;

        // Initialize
        initScene();
        loadAssets();
    </script>
</body>
</html>
